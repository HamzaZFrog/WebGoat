name: "Main / Pull requests build"
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

jobs:
    scan-repository:
        name: Frogbot scan-repository
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: write
            security-events: write
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v7
            -   name: Install Frogbot
                run: |
                    curl -fsSL -o "$RUNNER_TEMP/frogbot" "https://releases.jfrog.io/artifactory/frogbot/v3/3.7.0/frogbot-linux-amd64/frogbot"
                    chmod +x "$RUNNER_TEMP/frogbot"
                    echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            -   name: Scan repository
                env:
                    JF_URL: ${{ secrets.FROGBOT_URL }}
                    JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}
                    JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    JF_GIT_PROVIDER: github
                    JF_GIT_OWNER: ${{ github.repository_owner }}
                    JF_GIT_REPO: ${{ github.event.repository.name }}
                    JF_GIT_BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
                    JF_PROJECT_KEY: wbg
                run: frogbot scan-repository
    pre-commit:
        name: Pre-commit check
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v7
            -   name: Setup python
                uses: actions/setup-python@v7
                with:
                    python-version: "3.9"
            -   name: Setup Java
                uses: ./.github/actions/java-setup
                with:
                    cache: ""
            -   name: Pre-commit checks
                uses: pre-commit/action@v3.0.1
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@v1.1.0
                if: always()
    build:
        runs-on: ${{ matrix.os }}
        needs: [ scan-repository, pre-commit ]
        strategy:
            fail-fast: true
            matrix:
                os: [ windows-latest, ubuntu-latest, macos-15-intel ]
        env:
            JFROG_CLI_BUILD_NAME: webgoat
            JFROG_CLI_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Setup JFrog CLI
                uses: jfrog/setup-jfrog-cli@v4
                env:
                    JF_URL: ${{ secrets.FROGBOT_URL }}
                    JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}
                    JF_PROJECT: wbg
                with:
                    disable-auto-build-publish: true
            -   name: Configure Maven resolution
                if: matrix.os != 'ubuntu-latest'
                shell: bash
                run: |
                    jf mvn-config \
                      --repo-resolve-releases wbg-maven-remote \
                      --repo-resolve-snapshots wbg-maven-remote
            -   name: Configure Maven resolution and deployment
                if: matrix.os == 'ubuntu-latest'
                shell: bash
                run: |
                    jf mvn-config \
                      --repo-resolve-releases wbg-maven-remote \
                      --repo-resolve-snapshots wbg-maven-remote \
                      --repo-deploy-releases wbg-maven-local \
                      --repo-deploy-snapshots wbg-maven-local
            -   name: Verify on this OS
                if: matrix.os != 'ubuntu-latest'
                shell: bash
                run: jf mvn --no-transfer-progress verify
            -   name: Build, test, and publish Maven artifacts
                if: matrix.os == 'ubuntu-latest'
                shell: bash
                run: jf mvn --no-transfer-progress install
            -   name: Publish build info
                if: matrix.os == 'ubuntu-latest'
                shell: bash
                run: |
                    jf rt build-collect-env
                    jf rt build-add-git
                    jf rt build-publish
            -   name: Scan build info with Xray
                if: matrix.os == 'ubuntu-latest'
                shell: bash
                run: jf build-scan
